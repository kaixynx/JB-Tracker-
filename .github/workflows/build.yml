      - name: Extract Android project
        run: |
          mkdir project
          unzip -o JB_Tracker_Android_Project_v2.zip -d project
          if [ -d "project/JB_Tracker_Android_Project_v2" ]; then
            echo "PROJECT_SUBDIR=project/JB_Tracker_Android_Project_v2" >> $GITHUB_ENV
            SUBDIR="project/JB_Tracker_Android_Project_v2"
          else
            echo "PROJECT_SUBDIR=project" >> $GITHUB_ENV
            SUBDIR="project"
          fi
          # Trik memaksa Java 17 di build.gradle aplikasi
          find $SUBDIR -name "build.gradle*" -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} +
          find $SUBDIR -name "build.gradle*" -exec sed -i 's/"1.8"/"17"/g' {} +

      - name: Build APK
        run: gradle -p ${{ env.PROJECT_SUBDIR }} :app:assembleDebug
        

name: Build JB Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -o JB_Tracker_Android_Project_v2.zip -d project
          if [ -d "project/JB_Tracker_Android_Project_v2" ]; then
            echo "PROJECT_SUBDIR=project/JB_Tracker_Android_Project_v2" >> $GITHUB_ENV
            SUBDIR="project/JB_Tracker_Android_Project_v2"
          else
            echo "PROJECT_SUBDIR=project" >> $GITHUB_ENV
            SUBDIR="project"
          fi
          
          # SKRIP AMPUH: Memaksa semua konfigurasi compileOptions dan kotlinOptions ke 1.8 di akhir file build.gradle
          find $SUBDIR -name "build.gradle" -exec sh -c 'cat << "EOF" >> "$1"

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF' _ {} \;

      - name: Build APK
        run: gradle -p ${{ env.PROJECT_SUBDIR }} :app:assembleDebug
        

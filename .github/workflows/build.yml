
name: Build JB Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o JB_Tracker_Android_Project_v2.zip -d project

      - name: Enable AndroidX
        run: |
          touch project/gradle.properties

          if grep -q '^android.useAndroidX=' project/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' project/gradle.properties
          else
            echo 'android.useAndroidX=true' >> project/gradle.properties
          fi

      - name: Configure Java and Kotlin 17
        run: |
          cat >> project/app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Add AndroidX dependency
        run: |
          cat >> project/app/build.gradle <<'EOF'

          dependencies {
              implementation 'androidx.activity:activity-ktx:1.9.3'
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p project --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JB-Tracker-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

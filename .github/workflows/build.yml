name: Build JB Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -o JB_Tracker_Android_Project_v2.zip -d project
          
          # Cari di mana letak folder 'app' sebenarnya di dalam hasil ekstrak zip
          APP_DIR=$(find project -type d -name "app" | head -n 1)
          
          if [ -n "$APP_DIR" ]; then
            # Mengambil direktori induk dari folder 'app' sebagai root project-nya
            REAL_ROOT=$(dirname "$APP_DIR")
            echo "PROJECT_SUBDIR=$REAL_ROOT" >> $GITHUB_ENV
            echo "Menemukan root proyek di: $REAL_ROOT"
            
            # Kunci perbaikan: Modifikasi HANYA pada build.gradle milik modul app, bukan root project
            cat << "EOF" >> "$APP_DIR/build.gradle"

            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = "1.8"
                }
            }

            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_1_8
                    targetCompatibility JavaVersion.VERSION_1_8
                }
            }
            EOF
            echo "Konfigurasi target JVM 1.8 berhasil disuntikkan ke modul app."
          else
            echo "PROJECT_SUBDIR=project" >> $GITHUB_ENV
            echo "Peringatan: Folder app tidak ditemukan, menggunakan fallback root biasa."
          fi

      - name: Build APK
        run: gradle -p ${{ env.PROJECT_SUBDIR }} :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JB-Tracker-APK
          path: ${{ env.PROJECT_SUBDIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

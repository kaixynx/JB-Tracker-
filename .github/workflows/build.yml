name: Build JB Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Menggunakan aksi resmi GitHub yang jauh lebih stabil dan aman dari error 'tools'
      - name: Set up Android SDK
        uses: actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -o JB_Tracker_Android_Project_v2.zip -d project
          # Perintah di bawah ini untuk mendeteksi otomatis jika proyek Anda terbungkus folder lain
          if [ -d "project/JB_Tracker_Android_Project_v2" ]; then
            echo "PROJECT_SUBDIR=project/JB_Tracker_Android_Project_v2" >> $GITHUB_ENV
          else
            echo "PROJECT_SUBDIR=project" >> $GITHUB_ENV
          fi

      - name: Build APK
        run: gradle -p ${{ env.PROJECT_SUBDIR }} :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JB-Tracker-APK
          path: ${{ env.PROJECT_SUBDIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
